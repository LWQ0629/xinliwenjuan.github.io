<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人格特质综合评估系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        /* 页面切换 */
        .page {
            display: none;
            padding: 30px;
        }
        .page.active {
            display: block;
        }

        /* 欢迎页 */
        #welcome-page {
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        #welcome-page h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        #welcome-page p {
            font-size: 1.2em;
            margin: 15px 0;
            opacity: 0.9;
        }
        .start-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 30px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* 问卷页 */
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .question-header h2 {
            color: #333;
            font-size: 1.5em;
        }
        .progress-bar {
            width: 200px;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.5s;
        }

        .question-block {
            background: #f8f9fa;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .question-text {
            font-size: 1.1em;
            color: #333;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .question-hint {
            font-size: 0.9em;
            color: #999;
            margin-top: 5px;
        }

        .scale-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }
        .scale-option {
            text-align: center;
            padding: 12px 5px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }
        .scale-option:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        .scale-option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        .scale-option input {
            display: none;
        }
        .scale-label {
            font-size: 0.8em;
            margin-top: 5px;
            display: block;
        }

        /* 分页控制 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
            gap: 20px;
        }
        .nav-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        .nav-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .page-info {
            color: #666;
            font-weight: bold;
        }

        /* 结果页 */
        #result-page h2 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .chart-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 40px;
            height: 400px;
        }
        .dimension-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .trait-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #764ba2;
        }
        .trait-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .trait-score {
            font-size: 1.5em;
            color: #667eea;
        }
        .trait-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
        }
        .trait-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .model-section {
            margin: 25px 0;
            padding: 20px;
            background: #fff3e0;
            border-radius: 10px;
        }
        .model-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #e65100;
            margin-bottom: 15px;
        }
        .model-content {
            line-height: 1.6;
            color: #555;
        }

        .confidence-badge {
            display: inline-block;
            background: #4caf50;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-left: 10px;
        }

        .download-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            display: block;
            margin: 20px auto;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 10px;
            }
            .page {
                padding: 20px;
            }
            h1 {
                font-size: 2em !important;
            }
        }
    </style>
</head>
<body>

        const DIMENSION_CONFIG = {

            "逻辑决策": {items:[51,52,53,55,56,57,58], reverse:[], sjt:{54:{A:5,B:2,C:2,D:4}}},

            "适应弹性": {items:[71,72,73,74,76,77], reverse:[75,78]}
        };

        // ========== 全局状态 ==========
        let currentPage = 0;
        const questionsPerPage = 6;
        const totalPages = Math.ceil(QUESTIONS.length / questionsPerPage);
        let answers = {};

        // ========== 初始化 ==========
        function startAssessment() {
            document.getElementById('welcome-page').classList.remove('active');
            document.getElementById('question-page').classList.add('active');
            renderQuestions();
            updatePagination();
        }

        // ========== 动态渲染题目 ==========
        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';
            
            const startIdx = currentPage * questionsPerPage;
            const endIdx = Math.min(startIdx + questionsPerPage, QUESTIONS.length);
            
            for (let i = startIdx; i < endIdx; i++) {
                const q = QUESTIONS[i];
                const block = document.createElement('div');
                block.className = 'question-block';
                
                if (q.type === 'sjt') {
                    // 情境题
                    const options = q.text.split('A)')[1].split('B)')[0];
                    block.innerHTML = `
                        <div class="question-text">${i+1}. ${q.text.split('A)')[0]}</div>
                        <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:15px;">
                            ${q.options.map((opt, idx) => `
                                <label class="scale-option" style="display:flex; align-items:center; justify-content:center; padding:15px;">
                                    <input type="radio" name="q${q.id}" value="${idx+1}" onchange="saveAnswer(${q.id}, ${idx+1})">
                                    <span style="margin-left:10px;">${opt}</span>
                                </label>
                            `).join('')}
                        </div>
                    `;
                } else {
                    // 普通李克特题
                    block.innerHTML = `
                        <div class="question-text">${i+1}. ${q.text}</div>
                        ${q.type ? `<div class="question-hint" style="color:#ff9800;">⚠️ 此题为效度检测，请认真作答</div>` : ''}
                        <div class="scale-container">
                            ${[1,2,3,4,5].map(v => `
                                <label class="scale-option" data-value="${v}">
                                    <input type="radio" name="q${q.id}" value="${v}" onchange="saveAnswer(${q.id}, ${v})">
                                    <span class="scale-label">${v}</span>
                                    <span class="scale-label">${v==1?'完全不符合':v==2?'不太符合':v==3?'不确定':v==4?'比较符合':'完全符合'}</span>
                                </label>
                            `).join('')}
                        </div>
                    `;
                }
                
                container.appendChild(block);
                
                // 恢复已选答案
                if (answers[q.id]) {
                    const input = block.querySelector(`input[value="${answers[q.id]}"]`);
                    if (input) input.checked = true;
                }
            }
        }

        // ========== 保存答案 ==========
        function saveAnswer(qid, value) {
            answers[qid] = value;
            updateProgress();
        }

        // ========== 分页控制 ==========
        function changePage(direction) {
            currentPage += direction;
            if (currentPage < 0) currentPage = 0;
            if (currentPage >= totalPages) currentPage = totalPages - 1;
            
            renderQuestions();
            updatePagination();
        }

        function updatePagination() {
            document.getElementById('current-page').textContent = currentPage + 1;
            document.getElementById('total-pages').textContent = totalPages;
            document.getElementById('prev-btn').disabled = currentPage === 0;
            
            const nextBtn = document.getElementById('next-btn');
            if (currentPage === totalPages - 1) {
                nextBtn.textContent = '提交问卷';
                nextBtn.onclick = submitQuestionnaire;
            } else {
                nextBtn.textContent = '下一页';
                nextBtn.onclick = () => changePage(1);
            }
        }

        function updateProgress() {
            const answered = Object.keys(answers).length;
            const total = QUESTIONS.length;
            const percentage = (answered / total) * 100;
            
            document.getElementById('progress-fill').style.width = `${percentage}%`;
            document.getElementById('progress-text').textContent = `已作答：${answered}/${total} 题`;
        }

        // ========== 提交与效度检验 ==========
        function submitQuestionnaire() {
            const answered = Object.keys(answers).length;
            if (answered < QUESTIONS.length) {
                if (!confirm(`还有 ${QUESTIONS.length - answered} 题未答，确定提交？`)) return;
            }

            // 效度检验
            const validity = validateQuestionnaire(answers);
            if (!validity.valid) {
                alert(`⚠️ 问卷无效：${validity.warnings.join('；')}`);
                return;
            }
            
            if (validity.status === '可疑') {
                if (!confirm(`⚠️ 检测到异常：${validity.warnings.join('；')}\n\n仍要提交？`)) return;
            }

            // 计算结果
            const dimScores = calculateAllDimensions(answers);
            showResults(dimScores);
        }

        function validateQuestionnaire(answers) {
            let warnings = [];
            
            // 注意力检测
            if (answers[83] !== 3) warnings.push('第83题未按要求选择');
            
            // 常识检测
            if (answers[84] >= 3) warnings.push('第84题常识错误');
            if (answers[85] >= 3) warnings.push('第85题常识错误');
            if (answers[86] >= 3) warnings.push('第86题常识错误');
            
            // 社会期许检测
            const lieScore = [79,80,81,82].map(qid => answers[qid] || 3).reduce((a,b) => a+b, 0);
            if (lieScore > 18) warnings.push('过度美化倾向');
            
            // 一致性检测（简单版）
            const ext = [1,2,3,4,5,6,7,8].map(qid => answers[qid] || 3);
            if (ext.length > 5 && Math.max(...ext) - Math.min(...ext) < 0.5) {
                warnings.push('答案模式异常');
            }
            
            // 时间检测（需前端记录）
            return {
                valid: warnings.length === 0 || !warnings.includes('第83题未按要求选择'),
                status: warnings.length === 0 ? '有效' : (warnings.includes('第83题未按要求选择') ? '无效' : '可疑'),
                warnings: warnings
            };
        }

        // ========== 结果页 ==========
        function showResults(dimScores) {
            document.getElementById('question-page').classList.remove('active');
            document.getElementById('result-page').classList.add('active');
            
            // 雷达图
            displayRadarChart(dimScores);
            
            // 维度卡片
            displayDimensionScores(dimScores);
            
            // 模型解读
            displayModelInterpretation(dimScores);
        }

        function displayRadarChart(scores) {
            const ctx = document.getElementById('radarChart').getContext('2d');
            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: Object.keys(scores),
                    datasets: [{
                        label: '您的得分',
                        data: Object.values(scores),
                        backgroundColor: 'rgba(102, 126, 234, 0.2)',
                        borderColor: 'rgba(102, 126, 234, 1)',
                        borderWidth: 2,
                        pointBackgroundColor: 'rgba(102, 126, 234, 1)'
                    }]
                },
                options: {
                    scales: {
                        r: { beginAtZero: true, max: 5, ticks: { stepSize: 1 } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function displayDimensionScores(scores) {
            const container = document.getElementById('dimension-scores');
            container.innerHTML = Object.entries(scores).map(([dim, score]) => `
                <div class="trait-card">
                    <div class="trait-name">${dim}</div>
                    <div class="trait-score">${score.toFixed(2)} / 5.0</div>
                    <div class="trait-bar">
                        <div class="trait-fill" style="width:${(score/5)*100}%"></div>
                    </div>
                </div>
            `).join('');
        }

        function displayModelInterpretation(scores) {
            const container = document.getElementById('model-interpretation');
            const mbti = mapMBTI(scores);
            const temperament = mapTemperament(scores);
            const dark = mapDarkTriad(scores);
            
            container.innerHTML = `
                <div class="model-section">
                    <div class="model-title">🔄 MBTI倾向类型</div>
                    <div class="model-content">
                        <strong style="font-size:2em;">${mbti.type}</strong>
                        <span class="confidence-badge">置信度 ${(mbti.confidence * 100).toFixed(0)}%</span>
                        <p>解读：${mbti.description}</p>
                        <p>适合领域：${mbti.career}</p>
                    </div>
                </div>
                
                <div class="model-section">
                    <div class="model-title">🎭 主导气质类型</div>
                    <div class="model-content">
                        <strong style="font-size:1.5em;">${temperament.dominant}</strong>
                        <span class="confidence-badge">匹配度 ${(temperament.match * 100).toFixed(0)}%</span>
                        <p>特征：${temperament.traits}</p>
                    </div>
                </div>
                
                <div class="model-section">
                    <div class="model-title">🌑 黑暗三联征评估</div>
                    <div class="model-content">
                        自恋: <span style="color:${dark.narcissism.level==='高'?'#f44336':'#4caf50'}">${dark.narcissism.level} (${dark.narcissism.z.toFixed(1)})</span> | 
                        马基雅维利主义: <span style="color:${dark.machiavellianism.level==='高'?'#f44336':'#4caf50'}">${dark.machiavellianism.level} (${dark.machiavellianism.z.toFixed(1)})</span> | 
                        精神病态: <span style="color:${dark.psychopathy.level==='高'?'#f44336':'#4caf50'}">${dark.psychopathy.level} (${dark.psychopathy.z.toFixed(1)})</span>
                    </div>
                </div>
            `;
        }

        // ========== 跨模型映射算法 ==========
        function mapMBTI(scores) {
            const ei = scores['外向能量'];
            const sn = scores['探索开放'];
            const tf = scores['逻辑决策'];
            const jp = scores['秩序执行'];
            
            return {
                type: `${ei>=3.5?'E':'I'}${sn>=3.5?'N':'S'}${tf>=3.5?'T':'F'}${jp>=3.5?'J':'P'}`,
                confidence: Math.min((Math.abs(ei-2.5) + Math.abs(sn-2.5) + Math.abs(tf-2.5) + Math.abs(jp-2.5)) / 6, 1),
                description: getMBTIDescription(ei, sn, tf, jp),
                career: getMBTICareer(ei, sn, tf, jp)
            };
        }

        function mapTemperament(scores) {
            const temps = {
                '多血质': (Math.max(scores['外向能量'],4) + scores['探索开放'] + scores['适应弹性']) / 3,
                '胆汁质': (scores['外向能量'] + (6-scores['情绪稳定']) + scores['控制野心']) / 3,
                '粘液质': ((6-scores['外向能量']) + scores['情绪稳定'] + scores['秩序执行']) / 3,
                '抑郁质': ((6-scores['外向能量']) + (6-scores['情绪稳定']) + (6-scores['协作亲和'])) / 3
            };
            
            const dominant = Object.entries(temps).sort((a,b) => b[1] - a[1])[0];
            return {
                dominant: dominant[0],
                match: dominant[1] / 5,
                traits: getTemperamentTraits(dominant[0])
            };
        }

        function mapDarkTriad(scores) {
            const narc = (scores['外向能量'] + scores['控制野心'] + (6-scores['协作亲和'])) / 3;
            const mach = scores['控制野心'];
            const psych = (scores['控制野心'] + (6-scores['情绪稳定']) + (6-scores['秩序执行'])) / 3;
            
            const level = z => z > 3.5 ? '高' : z > 3.0 ? '中' : '低';
            return {
                narcissism: {z: narc, level: level(narc)},
                machiavellianism: {z: mach, level: level(mach)},
                psychopathy: {z: psych, level: level(psych)}
            };
        }

        // ========== 辅助函数 ==========
        function getMBTIDescription(ei, sn, tf, jp) {
            const profiles = {
                'INTJ': '战略家型：独立、理性、喜欢复杂系统',
                'ENTJ': '指挥官型：果断、领导力、擅长组织',
                'INFP': '理想主义者：价值导向、共情能力强',
                // ... 可扩展16种完整描述
            };
            const type = `${ei>=3.5?'E':'I'}${sn>=3.5?'N':'S'}${tf>=3.5?'T':'F'}${jp>=3.5?'J':'P'}`;
            return profiles[type] || '混合型特征';
        }

        function getTemperamentTraits(type) {
            const traits = {
                '多血质': '活泼好动，善于交际，兴趣广泛',
                '胆汁质': '精力旺盛，果断勇敢，情绪激烈',
                '粘液质': '安静稳重，踏实耐心，自律性强',
                '抑郁质': '敏感细腻，观察力强，体验深刻'
            };
            return traits[type];
        }

        function downloadPDF() {
            alert('PDF导出功能需集成jsPDF库\n当前可右键打印→另存为PDF');
        }

        // ========== 启动 ==========
        document.getElementById('total-pages').textContent = totalPages;
    </script>
</body>
</html>
